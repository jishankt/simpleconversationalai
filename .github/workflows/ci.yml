name: SalesAI CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        python -c "import nltk; nltk.download('punkt', quiet=True); nltk.download('punkt_tab', quiet=True); nltk.download('stopwords', quiet=True)"

    - name: Run Architecture & Security Tests
      run: |
        python -m unittest tests/test_architecture_single_orchestrator.py
        python -m unittest tests/test_security_hardening.py

    - name: Run Claim Validation & Zero-Hallucination Tests
      run: |
        python -m unittest tests/test_claim_validator.py

    - name: Run RAG & Retrieval Tests
      run: |
        python -m unittest test_rag.py
        python -m unittest tests/test_retrieval_and_eligibility.py

    - name: Run Domain & Comprehensive Tests
      run: |
        python -m unittest discover -s tests -p "test_*.py"
        python -m unittest test_nlp.py test_consumables.py
